# Hardware-independent remote profile; budgets remain inherited from full.yaml.
extends: full.yaml
training:
  num_envs: 64
optimization:
  ctm_compile: reduce-overhead
  # Doubling samples per update approximately halves updates versus 16 slots/4 groups.
  # The FourRooms P half-length tail adds 8 updates across the two visits.
  minibatches: 8
  encoder_microbatch_images: 200
