# RTX 5090 32 GB / 16-core host profile. Stage visits and transition budgets
# inherit full.yaml unchanged; do not use this file to resume full.yaml runs.
extends: full.yaml
evaluation:
  backend: subprocess
  num_envs: 16
training:
  # Batch more observations per inference call. VectorEnvAdapter still steps
  # environments synchronously, so this does not create CPU parallelism.
  num_envs: 16
ppo:
  # Four full-environment groups preserve 50-step recurrent trajectories.
  # Each minibatch has 4 * 50 = 200 transitions instead of 2 * 50 = 100.
  num_minibatches: 4
  # One ResNet forward covers the full 4 * 50 = 200-image PPO minibatch.
  # Verify end-to-end X update time and peak VRAM on the actual 5090.
  encoder_microbatch_images: 200
distill:
  # Four groups yield 200 learning targets plus 40 burn-in observations.
  minibatches: 4
