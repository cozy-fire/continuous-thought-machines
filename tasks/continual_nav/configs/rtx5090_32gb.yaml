# RTX 5090 32 GB / 16-core host profile. Stage visits and environment-transition
# budgets inherit full.yaml unchanged; do not use this file to resume full.yaml runs.
extends: full.yaml
replay:
  fit_cache: memory
evaluation:
  backend: subprocess
  num_envs: 16
training:
  # Batch more observations per inference call. VectorEnvAdapter still steps
  # environments synchronously, so this does not create CPU parallelism.
  num_envs: 16
world:
  # 512 * 2500 = 256 * 5000 sampled transitions per W.fit round.
  # The larger batch changes optimization even though sample exposure matches.
  batch_size: 512
  updates_per_round: 2500
ppo:
  # Four full-environment groups preserve 50-step recurrent trajectories.
  # Each minibatch has 4 * 50 = 200 transitions instead of 2 * 50 = 100.
  num_minibatches: 4
distill:
  # Four groups yield 200 learning targets plus 40 burn-in observations.
  minibatches: 4
